<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calm Money Budget Planner</title>
<meta name="theme-color" content="#1F6B5C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#F6F4EF;--card:#fff;--ink:#22302B;--mute:#6B7570;--line:#E3E0D8;--pri:#1F6B5C;--pri2:#E4F1EC;--warn:#C0392B;--warn2:#FBE9E7;--gold:#C98B1A;--gold2:#FCF3E1;--r:16px;--fs:16px}
[data-theme=dark]{--bg:#121816;--card:#1B2420;--ink:#E8EEEA;--mute:#9AA8A1;--line:#2C3832;--pri:#4FB39A;--pri2:#1E3830;--warn:#FF7B6B;--warn2:#3A2421;--gold:#F0B84A;--gold2:#3A3020}
[data-big=true]{--fs:19px}
*{box-sizing:border-box}html,body{margin:0}body{font:var(--fs)/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
header{background:var(--pri);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:1.15em;font-weight:700}header small{opacity:.85}
.demo{background:var(--gold);color:#fff;text-align:center;padding:8px;font-weight:600;font-size:.9em}
.demo a{color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:8px 2px 9px;font-size:.72em;font-weight:600;cursor:pointer}
nav button span{display:block;font-size:1.55em;line-height:1.2}
nav button.on{color:var(--pri)}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
h2{font-size:1.1em;margin:0 0 10px}h3{font-size:1em;margin:14px 0 8px}
.big{font-size:2.4em;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.mute{color:var(--mute);font-size:.9em}.ok{color:var(--pri)}.bad{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--pri2);border-radius:12px;padding:10px 12px}.stat b{display:block;font-size:1.2em}
.stat.w{background:var(--warn2)}.stat.g{background:var(--gold2)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}.row .grow{flex:1;min-width:0}.row .amt{font-weight:700;white-space:nowrap}
.pill{display:inline-block;font-size:.75em;padding:2px 8px;border-radius:99px;background:var(--pri2);color:var(--pri);font-weight:600}
.pill.w{background:var(--warn2);color:var(--warn)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.bar i.w{background:var(--warn)}.bar i.g{background:var(--gold)}
button.btn,.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;background:var(--pri);color:#fff;cursor:pointer}
.btn.sec{background:var(--pri2);color:var(--pri)}.btn.w{background:var(--warn2);color:var(--warn)}.btn.sm{padding:7px 11px;font-size:.85em;border-radius:10px}
.btn.full{width:100%}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
label{display:block;font-size:.85em;font-weight:600;color:var(--mute);margin:8px 0 4px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.form .f{grid-column:1/-1}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--pri);background:none;cursor:pointer;flex:none;color:#fff;font-weight:900}
.chk.on{background:var(--pri)}
.x{border:0;background:none;color:var(--mute);font-size:1.2em;cursor:pointer;padding:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{min-height:62px;border-radius:10px;background:var(--bg);padding:4px;font-size:.72em;overflow:hidden}
.cal .h{min-height:auto;background:none;text-align:center;font-weight:700;color:var(--mute)}
.cal .t{outline:2px solid var(--pri)}.cal .e{background:none}
.cal em{display:block;font-style:normal;border-radius:5px;padding:1px 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .b{background:var(--warn2);color:var(--warn)}.cal .p{background:var(--pri2);color:var(--pri);font-weight:700}
.cats{display:flex;flex-wrap:wrap;gap:8px}.cats button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:8px 12px;font:inherit;font-size:.9em;cursor:pointer}
.cats button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chart{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;height:100%;font-size:.65em;color:var(--mute)}
.chart i{width:42%;border-radius:4px 4px 0 0;display:block}.chart .pair{display:flex;align-items:flex-end;justify-content:center;gap:2px;width:100%;flex:1}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:9;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.fab{position:fixed;right:18px;bottom:96px;width:62px;height:62px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:2em;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:7}
.hide{display:none!important}
@media(min-width:900px){nav{top:0;bottom:auto;left:0;right:auto;width:110px;height:100vh;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-top:70px}nav button{flex:none;padding:12px 4px}body{padding-left:110px;padding-bottom:20px}.fab{bottom:28px}.toast{bottom:28px}}
</style>
</head>
<body>
<div id="demo" class="demo hide">DEMO with sample data. Changes are not saved. <a id="buy" href="#" target="_blank">Get your own copy on Etsy</a></div>
<header><h1 id="hello">Calm Money Budget Planner</h1><small id="sub"></small></header>
<main id="app"></main>
<button class="fab" id="fab" title="Add spending">+</button>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<script>
const ETSY="https://www.etsy.com/ca/listing/4617260585";
const DEMO=/demo/i.test(location.search)||window.FORCE_DEMO===true;
const KEY="calmMoneyBudget.v1";
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const P=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const TODAY=()=>iso(new Date());
const add=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const nice=s=>{const d=P(s);return MN[d.getMonth()]+" "+d.getDate()};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S;
function blank(){return{v:1,setup:false,name:"",cur:"$",balance:0,balanceDate:TODAY(),pay:{amount:0,freq:"biweekly",next:TODAY()},savePerPay:0,bills:[],tx:[],
cats:[{n:"Groceries",e:"🛒",cap:500},{n:"Gas",e:"⛽",cap:250},{n:"Eating out",e:"🍔",cap:150},{n:"Shopping",e:"🛍️",cap:150},{n:"Kids",e:"🧸",cap:100},{n:"Fun",e:"🎉",cap:80},{n:"Health",e:"💊",cap:60},{n:"Other",e:"📦",cap:100},{n:"Bills",e:"🧾",cap:0},{n:"Savings",e:"🐷",cap:0},{n:"Debt",e:"💳",cap:0}],
funds:[],debts:[],debtExtra:0,method:"snowball",theme:"light",big:false,tab:"today"}}
function sample(){const s=blank(),t=TODAY(),d=P(t);const md=k=>iso(new Date(d.getFullYear(),d.getMonth(),k));
Object.assign(s,{setup:true,name:"Jordan",balance:1480,balanceDate:add(t,-6),pay:{amount:2150,freq:"biweekly",next:add(t,5)},savePerPay:100,
bills:[{id:uid(),n:"Rent",a:1350,f:"monthly",d:md(1),auto:false,paid:{}},{id:uid(),n:"Phone",a:65,f:"monthly",d:md(Math.min(d.getDate()+2,28)),auto:true,paid:{}},{id:uid(),n:"Car insurance",a:142,f:"monthly",d:md(Math.min(d.getDate()+4,28)),auto:true,paid:{}},{id:uid(),n:"Internet",a:75,f:"monthly",d:md(20),auto:true,paid:{}},{id:uid(),n:"Streaming",a:18,f:"monthly",d:md(9),auto:true,paid:{}},{id:uid(),n:"Gym",a:12,f:"biweekly",d:add(t,-3),auto:true,paid:{}}],
funds:[{id:uid(),n:"Emergency fund",e:"🛟",goal:3000,saved:1150},{id:uid(),n:"Christmas gifts",e:"🎁",goal:600,saved:420},{id:uid(),n:"Vacation",e:"🏖️",goal:2000,saved:350}],
debts:[{id:uid(),n:"Visa card",bal:2400,apr:20.99,min:72},{id:uid(),n:"Car loan",bal:9800,apr:7.5,min:285},{id:uid(),n:"Line of credit",bal:1300,apr:11.2,min:40}],debtExtra:150});
s.bills.forEach(b=>b.since=s.balanceDate);s.bills[0].paid[md(1)]=true;if(md(9)<=t)s.bills[4].paid[md(9)]=true;
const tx=[["Groceries",86.4,"Superstore",-1],["Gas",64,"Fill up",-2],["Eating out",23.5,"Lunch",-2],["Groceries",41.2,"Milk and bread",-4],["Kids",29.99,"School shoes",-5],["Fun",18,"Movies",-6],["Shopping",54,"Amazon",-8],["Groceries",112.3,"Costco",-10],["Gas",58,"",-12],["Health",22,"Pharmacy",-13]];
tx.forEach(([c,a,n,o])=>s.tx.push({id:uid(),date:add(t,o),a,c,note:n,type:"out"}));
for(let m=1;m<11;m++){const dd=new Date(d.getFullYear(),d.getMonth()-m,15);if(dd.getFullYear()!==d.getFullYear())break;const w=1+Math.sin(m*1.7)*.12;s.tx.push({id:uid(),date:iso(dd),a:4300+(m%3)*120,c:"Income",note:"Paycheques",type:"in"});[["Bills",1662],["Groceries",470],["Gas",225],["Eating out",140],["Shopping",160],["Kids",90],["Fun",70],["Health",45],["Debt",510],["Other",85]].forEach(([c,a])=>s.tx.push({id:uid(),date:iso(dd),a:Math.round(a*(c==="Bills"||c==="Debt"?1:w)),c,note:c+" (month total)",type:"out"}))}
return s}
function autoPay(){const t=TODAY();S.bills.forEach(b=>{if(!b.auto)return;const from=b.since&&b.since>S.balanceDate?b.since:S.balanceDate;occ(b.d,b.f,from,t).forEach(d=>{if(!b.paid[d]){b.paid[d]=true;S.tx.push({id:uid(),date:d,a:b.a,c:"Bills",note:b.n+" (autopay)",type:"out",bill:b.id+d})}})})}
function load(){if(DEMO){S=sample();autoPay();return}try{S=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||"null")||{})}catch(e){S=blank()}autoPay();save()}
function save(){if(DEMO)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Could not save on this device")}}
const money=n=>{const neg=n<0;n=Math.abs(n);return(neg?"−":"")+S.cur+n.toLocaleString("en-CA",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._);t._=setTimeout(()=>t.classList.remove("on"),1800)}
// recurring dates
function occ(anchor,f,from,to){const out=[];if(!anchor)return out;
 if(f==="once"){if(anchor>=from&&anchor<=to)out.push(anchor);return out}
 if(f==="weekly"||f==="biweekly"){const st=f==="weekly"?7:14;let d=anchor;const diff=Math.round((P(from)-P(d))/864e5);if(diff>0)d=add(d,Math.ceil(diff/st)*st);while(d<=to){if(d>=from)out.push(d);d=add(d,st)}return out}
 if(f==="semimonthly"){let y=P(from).getFullYear(),m=P(from).getMonth();for(let k=0;k<26;k++){[15,dim(y,m)].forEach(day=>{const s=iso(new Date(y,m,day));if(s>=from&&s<=to)out.push(s)});m++;if(m>11){m=0;y++}if(iso(new Date(y,m,1))>to)break}return out}
 const A=P(anchor),day=A.getDate();let y=P(from).getFullYear(),m=f==="yearly"?A.getMonth():P(from).getMonth();
 for(let k=0;k<40;k++){const s=iso(new Date(y,m,Math.min(day,dim(y,m))));if(s>to)break;if(s>=from&&s>=anchor)out.push(s);if(f==="yearly")y++;else{m++;if(m>11){m=0;y++}}}return out}
function paydays(from,to){return occ(S.pay.next,S.pay.freq,from,to)}
function nextPayday(){const t=TODAY();return paydays(add(t,1),add(t,70))[0]||add(t,14)}
function billsBetween(from,to){const r=[];S.bills.forEach(b=>occ(b.d,b.f,from,to).forEach(d=>r.push({b,d,paid:!!b.paid[d]})));return r.sort((x,y)=>x.d<y.d?-1:1)}
function currentBalance(){let b=+S.balance||0;S.tx.forEach(x=>{if(x.date>=S.balanceDate&&!x.pre)b+=x.type==="in"?x.a:-x.a});return b}
function monthSpend(y,m,cat){const p=y+"-"+pad(m+1);return S.tx.filter(x=>x.type==="out"&&x.date.startsWith(p)&&(!cat||x.c===cat)).reduce((a,x)=>a+x.a,0)}
function safe(){const t=TODAY(),np=nextPayday(),bal=currentBalance();
 const due=billsBetween(add(t,-31),add(np,-1)).filter(o=>!o.paid&&(!o.b.auto||o.d>=t));
 const billsDue=due.filter(o=>o.d<np).reduce((a,o)=>a+o.b.a,0);const sv=+S.savePerPay||0;
 const s=bal-billsDue-sv;const days=Math.max(1,Math.round((P(np)-P(t))/864e5));return{bal,billsDue,sv,s,np,days,perDay:s/days,due}}
// ---------- views
const TABS=[["today","🏠","Today"],["spend","🛒","Spending"],["bills","🧾","Bills"],["cal","📅","Calendar"],["save","🐷","Savings"],["debt","💳","Debt"],["year","📊","Year"],["set","⚙️","Settings"]];
function nav(){$("#nav").innerHTML=TABS.map(([k,i,l])=>`<button class="${S.tab===k?"on":""}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join("")}
function go(k){S.tab=k;save();render();scrollTo(0,0)}
function render(){document.documentElement.dataset.theme=S.theme;document.documentElement.dataset.big=S.big;nav();
 $("#hello").textContent=S.name?`Hi ${S.name} 👋`:"Calm Money Budget Planner";$("#sub").textContent=new Date().toLocaleDateString("en-CA",{weekday:"long",month:"long",day:"numeric"});
 $("#fab").classList.toggle("hide",!S.setup||S.tab==="spend");$("#app").innerHTML=S.setup?V[S.tab]():setupView()}
function setupView(){return`<div class="card"><h2>Welcome! Let's set up your budget in 1 minute</h2><p class="mute">Everything stays private on this device. No bank login, no account, no subscription.</p>
<div class="form"><div class="f"><label>Your first name</label><input id="s_name" placeholder="e.g. Sam"></div>
<div><label>Currency</label><select id="s_cur"><option value="$">$ Dollar (CA$/US$)</option><option value="£">£ Pound</option><option value="€">€ Euro</option><option value="A$">A$ Australian dollar</option></select></div>
<div><label>Money in your account now</label><input id="s_bal" type="number" inputmode="decimal" placeholder="0"></div>
<div><label>Take-home pay (each paycheque)</label><input id="s_pay" type="number" inputmode="decimal" placeholder="0"></div>
<div><label>How often are you paid?</label><select id="s_freq"><option value="weekly">Every week</option><option value="biweekly" selected>Every 2 weeks</option><option value="semimonthly">Twice a month (15th and last day)</option><option value="monthly">Once a month</option></select></div>
<div class="f"><label>Next payday</label><input id="s_next" type="date" value="${add(TODAY(),7)}"></div></div>
<p><button class="btn full" onclick="finishSetup()">Start budgeting</button></p><p class="mute">Tip: next, add your bills in the 🧾 Bills tab. They repeat by themselves every month.</p></div>`}
function finishSetup(){S.name=$("#s_name").value.trim();S.cur=$("#s_cur").value;S.balance=+$("#s_bal").value||0;S.balanceDate=TODAY();S.pay={amount:+$("#s_pay").value||0,freq:$("#s_freq").value,next:$("#s_next").value||TODAY()};S.setup=true;S.tab="today";save();render();toast("All set!")}
const V={};
V.today=()=>{const k=safe(),t=TODAY(),d=new Date(),y=d.getFullYear(),m=d.getMonth();
 const up=billsBetween(t,add(t,14)).filter(o=>!o.paid);const over=billsBetween(add(t,-31),add(t,-1)).filter(o=>!o.paid&&!o.b.auto);
 const pd=paydays(add(t,-20),t).pop();const gotPaid=pd&&S.tx.some(x=>x.type==="in"&&x.date>=pd&&x.payday);
 const spent=monthSpend(y,m)-monthSpend(y,m,"Bills")-monthSpend(y,m,"Savings")-monthSpend(y,m,"Debt");
 return`${pd&&!gotPaid&&pd>=S.balanceDate?`<div class="card" style="background:var(--pri2)"><h2>💰 Payday was ${nice(pd)}</h2><p>Add your ${money(S.pay.amount)} paycheque to your balance?</p><button class="btn" onclick="gotPay('${pd}')">Yes, I got paid</button></div>`:""}
<div class="card"><div class="mute">Safe to spend until payday (${nice(k.np)})</div><div class="big ${k.s<0?"bad":"ok"}">${money(k.s)}</div>
<div class="mute">That's about <b>${money(Math.floor(k.perDay))}</b> a day for ${k.days} day${k.days>1?"s":""}.</div>
<div class="grid2" style="margin-top:12px"><div class="stat"><span class="mute">In your account</span><b>${money(k.bal)}</b></div><div class="stat w"><span class="mute">Bills before payday</span><b>${money(k.billsDue)}</b></div>
<div class="stat g"><span class="mute">Saving this paycheque</span><b>${money(k.sv)}</b></div><div class="stat"><span class="mute">Spent this month</span><b>${money(spent)}</b></div></div>
<p style="margin:12px 0 0"><button class="btn sec sm" onclick="fixBal()">Update my balance</button></p></div>
${over.length?`<div class="card"><h2 class="bad">⚠️ Not marked paid yet</h2>${over.map(billRow).join("")}</div>`:""}
<div class="card"><h2>Coming up (next 14 days)</h2>${up.length?up.map(billRow).join(""):`<p class="mute">No bills in the next 14 days. 🎉</p>`}
${paydays(t,add(t,14)).map(p=>`<div class="row"><span>💵</span><div class="grow">Payday</div><span class="pill">${nice(p)}</span><span class="amt ok">+${money(S.pay.amount)}</span></div>`).join("")}</div>
<div class="card"><h2>Spending caps this month</h2>${capRows(y,m,4)}<p><button class="btn sec sm" onclick="go('spend')">See all</button></p></div>
${S.funds.length?`<div class="card"><h2>Savings</h2>${S.funds.slice(0,3).map(fundRow).join("")}</div>`:""}`};
function billRow(o){return`<div class="row"><button class="chk ${o.paid?"on":""}" onclick="payBill('${o.b.id}','${o.d}')">${o.paid?"✓":""}</button><div class="grow"><b>${esc(o.b.n)}</b><div class="mute">${nice(o.d)}${o.b.auto?" · autopay":""}</div></div><span class="amt">${money(o.b.a)}</span></div>`}
function capRows(y,m,lim){const cs=S.cats.filter(c=>c.cap>0);return(lim?cs.slice(0,lim):cs).map(c=>{const sp=monthSpend(y,m,c.n),p=Math.min(100,sp/c.cap*100);return`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><span>${c.e} ${esc(c.n)}</span><span class="${sp>c.cap?"bad":""}"><b>${money(sp)}</b> of ${money(c.cap)}</span></div><div class="bar"><i class="${sp>c.cap?"w":p>80?"g":""}" style="width:${p}%"></i></div></div>`}).join("")||`<p class="mute">Set spending caps in the Spending tab.</p>`}
function fundRow(f){const p=f.goal?Math.min(100,f.saved/f.goal*100):0;return`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><span>${f.e||"🐷"} ${esc(f.n)}</span><span><b>${money(f.saved)}</b> of ${money(f.goal)}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}
function gotPay(d){S.tx.push({id:uid(),date:TODAY(),a:+S.pay.amount||0,c:"Income",note:"Paycheque "+nice(d),type:"in",payday:true});if(S.savePerPay>0&&S.funds[0]){S.funds[0].saved+=+S.savePerPay;S.tx.push({id:uid(),date:TODAY(),a:+S.savePerPay,c:"Savings",note:"To "+S.funds[0].n,type:"out"})}save();render();toast("Paycheque added 💵")}
function fixBal(){const v=prompt("How much money is in your account right now?",Math.round(currentBalance()*100)/100);if(v===null||v==="")return;S.balance=+v||0;S.balanceDate=TODAY();S.tx.forEach(x=>{if(x.date===TODAY())x.pre=true});save();render();toast("Balance updated")}
function payBill(id,d){const b=S.bills.find(x=>x.id===id);if(b.paid[d]){delete b.paid[d];S.tx=S.tx.filter(x=>x.bill!==id+d)}else{b.paid[d]=true;S.tx.push({id:uid(),date:TODAY(),a:b.a,c:"Bills",note:b.n,type:"out",bill:id+d})}save();render();toast(b.paid[d]?"Marked paid ✓":"Marked unpaid")}
// spending
let selCat="Groceries";
V.spend=()=>{const d=new Date(),y=d.getFullYear(),m=d.getMonth();const list=S.tx.filter(x=>x.date.startsWith(y+"-"+pad(m+1))).sort((a,b)=>a.date<b.date?1:-1);
 return`<div class="card"><h2>Quick add</h2>${quickForm()}</div><div class="card"><h2>Spending caps (${MN[m]})</h2>${capRows(y,m)}
 <h3>Change caps</h3>${S.cats.filter(c=>!["Bills","Savings","Debt"].includes(c.n)).map((c,i)=>`<div class="row"><span>${c.e}</span><div class="grow">${esc(c.n)}</div><input style="width:110px" type="number" value="${c.cap}" onchange="setCap('${esc(c.n)}',this.value)"></div>`).join("")}
 <div class="row"><input id="nc" placeholder="New category name"><button class="btn sm" onclick="newCat()">Add</button></div></div>
 <div class="card"><h2>This month's activity</h2>${list.map(x=>`<div class="row"><span>${(S.cats.find(c=>c.n===x.c)||{e:x.type==="in"?"💵":"📦"}).e}</span><div class="grow"><b>${esc(x.note||x.c)}</b><div class="mute">${nice(x.date)} · ${esc(x.c)}</div></div><span class="amt ${x.type==="in"?"ok":""}">${x.type==="in"?"+":""}${money(x.a)}</span><button class="x" onclick="delTx('${x.id}')">✕</button></div>`).join("")||`<p class="mute">Nothing yet this month.</p>`}</div>`};
function quickForm(){return`<div class="cats">${S.cats.filter(c=>!["Bills","Savings","Debt"].includes(c.n)).map(c=>`<button class="${selCat===c.n?"on":""}" onclick="selCat='${esc(c.n)}';this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${c.e} ${esc(c.n)}</button>`).join("")}</div>
<div class="form" style="margin-top:8px"><div><label>Amount</label><input id="q_a" type="number" inputmode="decimal" placeholder="0.00"></div><div><label>Date</label><input id="q_d" type="date" value="${TODAY()}"></div><div class="f"><label>Note (optional)</label><input id="q_n" placeholder="e.g. Coffee"></div>
<div><label>Type</label><select id="q_t"><option value="out">Money out</option><option value="in">Money in (extra income)</option></select></div><div style="display:flex;align-items:flex-end"><button class="btn full" onclick="quickAdd()">Add</button></div></div>`}
function quickAdd(){const a=+$("#q_a").value;if(!a){toast("Enter an amount");return}const t=$("#q_t").value;S.tx.push({id:uid(),date:$("#q_d").value||TODAY(),a,c:t==="in"?"Income":selCat,note:$("#q_n").value.trim(),type:t});save();closeSheet();render();toast("Added ✓")}
function delTx(id){if(!confirm("Delete this entry?"))return;S.tx=S.tx.filter(x=>x.id!==id);save();render()}
function setCap(n,v){const c=S.cats.find(c=>c.n===n);c.cap=+v||0;save();render()}
function newCat(){const n=$("#nc").value.trim();if(!n||S.cats.some(c=>c.n===n))return;S.cats.splice(S.cats.length-3,0,{n,e:"🏷️",cap:0});save();render()}
// bills
V.bills=()=>{const t=TODAY(),d=new Date(),y=d.getFullYear(),m=d.getMonth();const mo=billsBetween(iso(new Date(y,m,1)),iso(new Date(y,m,dim(y,m))));const tot=S.bills.reduce((a,b)=>a+b.a*({weekly:52/12,biweekly:26/12,monthly:1,yearly:1/12,once:0}[b.f]||1),0);
 return`<div class="card"><h2>Bills this month (${MN[m]})</h2><div class="grid2"><div class="stat"><span class="mute">Paid</span><b>${money(mo.filter(o=>o.paid).reduce((a,o)=>a+o.b.a,0))}</b></div><div class="stat w"><span class="mute">Still to pay</span><b>${money(mo.filter(o=>!o.paid).reduce((a,o)=>a+o.b.a,0))}</b></div></div>${mo.map(billRow).join("")||`<p class="mute">No bills yet. Add one below.</p>`}</div>
<div class="card"><h2>Add a bill</h2><p class="mute">Bills repeat by themselves. You never need to type them again.</p><div class="form"><div class="f"><label>Name</label><input id="b_n" placeholder="e.g. Rent, Phone, Netflix"></div><div><label>Amount</label><input id="b_a" type="number" inputmode="decimal"></div><div><label>Next due date</label><input id="b_d" type="date" value="${t}"></div>
<div><label>Repeats</label><select id="b_f"><option value="monthly">Every month</option><option value="biweekly">Every 2 weeks</option><option value="weekly">Every week</option><option value="yearly">Every year</option><option value="once">Just once</option></select></div><div><label>Autopay?</label><select id="b_auto"><option value="0">No, I pay it</option><option value="1">Yes, it comes out by itself</option></select></div></div><p><button class="btn full" onclick="addBill()">Add bill</button></p></div>
<div class="card"><h2>All bills <span class="mute">(about ${money(tot)}/month)</span></h2>${S.bills.map(b=>`<div class="row"><div class="grow"><b>${esc(b.n)}</b><div class="mute">${{monthly:"Monthly",biweekly:"Every 2 weeks",weekly:"Weekly",yearly:"Yearly",once:"Once"}[b.f]} · next ${nice(occ(b.d,b.f,t,add(t,400))[0]||b.d)}${b.auto?" · autopay":""}</div></div><span class="amt">${money(b.a)}</span><button class="x" onclick="editBill('${b.id}')">✎</button><button class="x" onclick="delBill('${b.id}')">✕</button></div>`).join("")}</div>`};
function addBill(){const n=$("#b_n").value.trim(),a=+$("#b_a").value;if(!n||!a){toast("Add a name and amount");return}S.bills.push({id:uid(),n,a,f:$("#b_f").value,d:$("#b_d").value||TODAY(),auto:$("#b_auto").value==="1",paid:{},since:TODAY()});save();render();toast("Bill added ✓")}
function editBill(id){const b=S.bills.find(x=>x.id===id);const v=prompt("New amount for "+b.n,b.a);if(v===null)return;b.a=+v||b.a;save();render()}
function delBill(id){if(!confirm("Delete this bill?"))return;S.bills=S.bills.filter(b=>b.id!==id);save();render()}
// calendar
let calY=new Date().getFullYear(),calM=new Date().getMonth();
V.cal=()=>{const first=new Date(calY,calM,1),n=dim(calY,calM),from=iso(first),to=iso(new Date(calY,calM,n)),bl=billsBetween(from,to),pd=paydays(from,to),t=TODAY();let h=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="h">${x}</div>`).join("");
 for(let i=0;i<first.getDay();i++)h+=`<div class="e"></div>`;
 for(let d=1;d<=n;d++){const s=iso(new Date(calY,calM,d));const sp=S.tx.filter(x=>x.date===s&&x.type==="out"&&x.c!=="Bills").reduce((a,x)=>a+x.a,0);
  h+=`<div class="${s===t?"t":""}"><b>${d}</b>${pd.includes(s)?`<em class="p">+${money(S.pay.amount)}</em>`:""}${bl.filter(o=>o.d===s).map(o=>`<em class="b">${o.paid?"✓ ":""}${esc(o.b.n)}</em>`).join("")}${sp?`<em>−${money(Math.round(sp))}</em>`:""}</div>`}
 return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><button class="btn sec sm" onclick="calM--;if(calM<0){calM=11;calY--}render()">◀</button><h2 style="margin:0">${MN[calM]} ${calY}</h2><button class="btn sec sm" onclick="calM++;if(calM>11){calM=0;calY++}render()">▶</button></div><div class="cal">${h}</div>
 <p class="mute"><span class="pill">Payday</span> <span class="pill w">Bill</span> Grey numbers = what you spent that day.</p></div>`};
// savings
V.save=()=>`<div class="card"><h2>Savings funds</h2><div class="form"><div class="f"><label>Saving this much each paycheque (goes to your first fund when you tap "I got paid")</label><input type="number" value="${S.savePerPay}" onchange="S.savePerPay=+this.value||0;save()"></div></div></div>
${S.funds.map(f=>{const left=f.goal-f.saved,per=S.savePerPay>0?Math.ceil(Math.max(0,left)/S.savePerPay):0;return`<div class="card">${fundRow(f)}<div class="mute">${left<=0?"🎉 Goal reached!":money(left)+" to go"+(per&&f===S.funds[0]?` · about ${per} more paycheque${per>1?"s":""}`:"")}</div><p style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:0"><button class="btn sm" onclick="fundAdd('${f.id}',1)">+ Add money</button><button class="btn sec sm" onclick="fundAdd('${f.id}',-1)">− Take out</button><button class="btn w sm" onclick="delFund('${f.id}')">Delete</button></p></div>`}).join("")}
<div class="card"><h2>New savings fund</h2><div class="form"><div class="f"><label>Name</label><input id="f_n" placeholder="e.g. Emergency fund"></div><div><label>Goal</label><input id="f_g" type="number"></div><div><label>Already saved</label><input id="f_s" type="number" value="0"></div></div><p><button class="btn full" onclick="addFund()">Add fund</button></p></div>`;
function addFund(){const n=$("#f_n").value.trim();if(!n)return;S.funds.push({id:uid(),n,e:"🐷",goal:+$("#f_g").value||0,saved:+$("#f_s").value||0});save();render()}
function fundAdd(id,sg){const f=S.funds.find(x=>x.id===id);const v=+prompt(sg>0?"How much are you adding?":"How much are you taking out?");if(!v)return;f.saved+=sg*v;if(sg>0)S.tx.push({id:uid(),date:TODAY(),a:v,c:"Savings",note:"To "+f.n,type:"out"});else S.tx.push({id:uid(),date:TODAY(),a:v,c:"Savings",note:"From "+f.n,type:"in"});save();render()}
function delFund(id){if(confirm("Delete this fund?")){S.funds=S.funds.filter(f=>f.id!==id);save();render()}}
// debt
function plan(method,extra){const ds=S.debts.map(d=>({...d,b:+d.bal}));let mo=0,int=0;const done={};
 while(ds.some(d=>d.b>0.005)&&mo<600){mo++;let pool=ds.reduce((a,d)=>a+(+d.min),0)+(+extra||0);
  ds.forEach(d=>{if(d.b>0){const i=d.b*(+d.apr/100/12);d.b+=i;int+=i}});
  ds.forEach(d=>{if(d.b>0){const p=Math.min(d.b,+d.min);d.b-=p;pool-=p}});
  const order=ds.filter(d=>d.b>0.005).sort((a,b)=>method==="avalanche"?b.apr-a.apr:a.b-b.b);
  for(const d of order){if(pool<=0)break;const p=Math.min(d.b,pool);d.b-=p;pool-=p}
  ds.forEach(d=>{if(d.b<=0.005&&!done[d.id])done[d.id]=mo})}
 return{mo,int,done,ok:mo<600}}
const inMonths=n=>{const d=new Date();d.setMonth(d.getMonth()+n);return MN[d.getMonth()]+" "+d.getFullYear()};
V.debt=()=>{const tot=S.debts.reduce((a,d)=>a+ +d.bal,0);const sn=plan("snowball",S.debtExtra),av=plan("avalanche",S.debtExtra),me=S.method==="avalanche"?av:sn;
 return`<div class="card"><h2>Debt payoff planner</h2><div class="grid2"><div class="stat w"><span class="mute">Total debt</span><b>${money(tot)}</b></div><div class="stat"><span class="mute">Debt-free</span><b>${S.debts.length?(me.ok?inMonths(me.mo):"Raise payments"):"—"}</b></div></div>
 <label>Extra I can pay each month (on top of minimums)</label><input type="number" value="${S.debtExtra}" onchange="S.debtExtra=+this.value||0;save();render()">
 <label>Method</label><div class="cats"><button class="${S.method==="snowball"?"on":""}" onclick="S.method='snowball';save();render()">❄️ Snowball (smallest first)</button><button class="${S.method==="avalanche"?"on":""}" onclick="S.method='avalanche';save();render()">🏔️ Avalanche (highest interest first)</button></div>
 ${S.debts.length&&sn.ok&&av.ok?`<p class="mute">Snowball: ${sn.mo} months, ${money(Math.round(sn.int))} interest. Avalanche: ${av.mo} months, ${money(Math.round(av.int))} interest. ${av.int<sn.int-1?`Avalanche saves you ${money(Math.round(sn.int-av.int))}.`:""}</p>`:""}</div>
 <div class="card"><h2>Your debts (payoff order)</h2>${[...S.debts].sort((a,b)=>(me.done[a.id]||999)-(me.done[b.id]||999)).map((d,i)=>`<div class="row"><span class="pill">${i+1}</span><div class="grow"><b>${esc(d.n)}</b><div class="mute">${d.apr}% · min ${money(+d.min)} · paid off ${me.done[d.id]?inMonths(me.done[d.id]):"—"}</div></div><span class="amt">${money(+d.bal)}</span><button class="x" onclick="payDebt('${d.id}')">✎</button><button class="x" onclick="delDebt('${d.id}')">✕</button></div>`).join("")||`<p class="mute">No debts added. 🎉</p>`}</div>
 <div class="card"><h2>Add a debt</h2><div class="form"><div class="f"><label>Name</label><input id="d_n" placeholder="e.g. Visa card"></div><div><label>Balance</label><input id="d_b" type="number"></div><div><label>Interest rate %</label><input id="d_r" type="number" step="0.01"></div><div class="f"><label>Minimum monthly payment</label><input id="d_m" type="number"></div></div><p><button class="btn full" onclick="addDebt()">Add debt</button></p></div>`};
function addDebt(){const n=$("#d_n").value.trim();if(!n)return;S.debts.push({id:uid(),n,bal:+$("#d_b").value||0,apr:+$("#d_r").value||0,min:+$("#d_m").value||0});save();render()}
function payDebt(id){const d=S.debts.find(x=>x.id===id);const v=prompt("New balance for "+d.n+" (after your payment)",d.bal);if(v===null)return;const nb=+v;if(nb<d.bal)S.tx.push({id:uid(),date:TODAY(),a:d.bal-nb,c:"Debt",note:d.n,type:"out"});d.bal=nb;save();render()}
function delDebt(id){if(confirm("Delete this debt?")){S.debts=S.debts.filter(d=>d.id!==id);save();render()}}
// year
V.year=()=>{const y=new Date().getFullYear();const rows=MN.map((n,m)=>{const p=y+"-"+pad(m+1);const i=S.tx.filter(x=>x.type==="in"&&x.date.startsWith(p)&&x.c!=="Savings").reduce((a,x)=>a+x.a,0);const o=S.tx.filter(x=>x.type==="out"&&x.date.startsWith(p)&&x.c!=="Savings").reduce((a,x)=>a+x.a,0);return{n,i,o}});const mx=Math.max(1,...rows.map(r=>Math.max(r.i,r.o)));const ti=rows.reduce((a,r)=>a+r.i,0),to=rows.reduce((a,r)=>a+r.o,0);
 const cats=S.cats.map(c=>({c,v:S.tx.filter(x=>x.type==="out"&&x.c===c.n&&x.date.startsWith(y+"")).reduce((a,x)=>a+x.a,0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);const cm=Math.max(1,...cats.map(x=>x.v));
 return`<div class="card"><h2>${y} at a glance</h2><div class="grid2"><div class="stat"><span class="mute">Money in</span><b>${money(Math.round(ti))}</b></div><div class="stat w"><span class="mute">Money out</span><b>${money(Math.round(to))}</b></div></div>
 <div class="chart">${rows.map(r=>`<div><div class="pair"><i style="height:${r.i/mx*100}%;background:var(--pri)"></i><i style="height:${r.o/mx*100}%;background:var(--warn)"></i></div>${r.n}</div>`).join("")}</div><p class="mute"><span class="pill">Green = in</span> <span class="pill w">Red = out</span></p></div>
 <div class="card"><h2>Where the money went</h2>${cats.map(x=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><span>${x.c.e} ${esc(x.c.n)}</span><b>${money(Math.round(x.v))}</b></div><div class="bar"><i style="width:${x.v/cm*100}%"></i></div></div>`).join("")||`<p class="mute">Add spending to see your year.</p>`}</div>`};
// settings
V.set=()=>`<div class="card"><h2>Settings</h2><div class="form"><div><label>First name</label><input value="${esc(S.name)}" onchange="S.name=this.value;save();render()"></div><div><label>Currency</label><select onchange="S.cur=this.value;save();render()">${["$","£","€","A$","CA$","US$"].map(c=>`<option ${S.cur===c?"selected":""}>${c}</option>`).join("")}</select></div>
<div><label>Take-home pay</label><input type="number" value="${S.pay.amount}" onchange="S.pay.amount=+this.value||0;save()"></div><div><label>Paid</label><select onchange="S.pay.freq=this.value;save()">${[["weekly","Every week"],["biweekly","Every 2 weeks"],["semimonthly","Twice a month"],["monthly","Once a month"]].map(([v,l])=>`<option value="${v}" ${S.pay.freq===v?"selected":""}>${l}</option>`).join("")}</select></div>
<div class="f"><label>A recent or next payday</label><input type="date" value="${S.pay.next}" onchange="S.pay.next=this.value;save()"></div>
<div><label>Look</label><select onchange="S.theme=this.value;save();render()"><option value="light" ${S.theme==="light"?"selected":""}>☀️ Light</option><option value="dark" ${S.theme==="dark"?"selected":""}>🌙 Dark</option></select></div><div><label>Text size</label><select onchange="S.big=this.value==='1';save();render()"><option value="0">Normal</option><option value="1" ${S.big?"selected":""}>Large</option></select></div></div></div>
<div class="card"><h2>Backup and move to a new device</h2><p class="mute">Your budget is saved only on this device. Tap Backup once a month and keep the file safe (email it to yourself). Use Restore to load it on a new phone or computer.</p>
<p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="backup()">⬇️ Backup</button><label class="btn sec" style="margin:0;color:var(--pri);font-size:1em">⬆️ Restore<input type="file" accept=".json" class="hide" onchange="restore(this)"></label><button class="btn sec" onclick="csv()">📄 Export spending (CSV)</button></p></div>
<div class="card"><h2>Install on your phone</h2><p class="mute"><b>iPhone:</b> open this page in Safari, tap Share, then "Add to Home Screen".<br><b>Android:</b> open in Chrome, tap ⋮, then "Install app" or "Add to Home screen".<br>After that it opens like an app and works without internet.</p></div>
<div class="card"><h2>Start over</h2><button class="btn w" onclick="if(confirm('Delete ALL your budget data on this device?')){S=blank();save();render()}">Delete everything</button></div>
<p class="mute" style="text-align:center">Calm Money Budget Planner · ClearPage Canada · for personal use. Not financial advice.</p>`;
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function backup(){dl("budget-backup-"+TODAY()+".json",JSON.stringify(S),"application/json");toast("Backup saved")}
function restore(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.v)throw 0;S=Object.assign(blank(),o);save();render();toast("Restored ✓")}catch(e){toast("That file is not a budget backup")}})}
function csv(){dl("spending-"+TODAY()+".csv","Date,Type,Category,Note,Amount\n"+S.tx.map(x=>[x.date,x.type==="in"?"In":"Out",x.c,'"'+(x.note||"").replace(/"/g,'""')+'"',x.a].join(",")).join("\n"),"text/csv")}
// add-spending sheet
function closeSheet(){const s=$("#sheet");if(s)s.remove()}
$("#fab").onclick=()=>{closeSheet();const d=document.createElement("div");d.id="sheet";d.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8;display:flex;align-items:flex-end;justify-content:center";d.innerHTML=`<div class="card" style="width:100%;max-width:560px;margin:0;border-radius:20px 20px 0 0;padding-bottom:28px"><div style="display:flex;justify-content:space-between"><h2>Add spending</h2><button class="x" onclick="closeSheet()">✕</button></div>${quickForm()}</div>`;d.onclick=e=>{if(e.target===d)closeSheet()};document.body.appendChild(d);setTimeout(()=>{const q=document.querySelector("#sheet #q_a");q&&q.focus()},50)};
load();if(DEMO){$("#demo").classList.remove("hide");$("#buy").href=ETSY}render();
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
